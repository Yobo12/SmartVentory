<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — SmartVentory</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-root"></aside>

    <div class="app-main">
      <header class="header" id="header-root"></header>

      <main class="page-content">
        <div style="margin-bottom:var(--space-6);">
          <h2 style="margin-bottom:var(--space-1);">User Management</h2>
          <p class="text-secondary">Add, edit, and manage access for your team. Admin-only.</p>
        </div>

        <div class="table-toolbar fade-in">
          <div class="table-search">
            🔍
            <input type="text" id="users-search" placeholder="Search by name or email…" />
          </div>
          <div class="table-toolbar__spacer"></div>
          <button class="btn btn-primary" id="add-user-btn">+ Add User</button>
        </div>

        <div class="table-wrap" id="users-table-wrap">
          <div class="table-loading">Loading users…</div>
        </div>

        <div class="table-pagination" id="users-pagination"></div>
      </main>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="js/settings.js"></script>
</body>
</html>
