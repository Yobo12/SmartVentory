<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales — SmartVentory</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-root"></aside>

    <div class="app-main">
      <header class="header" id="header-root"></header>

      <main class="page-content">
        <div class="table-toolbar fade-in">
          <div class="table-toolbar__spacer"></div>
          <button class="btn btn-primary" id="record-sale-btn">+ Record Sale</button>
        </div>

        <div class="table-wrap" id="sales-table-wrap">
          <div class="table-loading">Loading sales…</div>
        </div>

        <div class="table-pagination" id="sales-pagination"></div>
      </main>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="js/sales.js"></script>
</body>
</html>
