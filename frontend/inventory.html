<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory — SmartVentory</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-root"></aside>

    <div class="app-main">
      <header class="header" id="header-root"></header>

      <main class="page-content">
        <div class="table-toolbar fade-in">
          <div class="table-search">
            🔍
            <input type="text" id="inventory-search" placeholder="Search by product or SKU…" />
          </div>
          <div class="table-toolbar__spacer"></div>
          <label class="toggle">
            <input type="checkbox" id="low-stock-toggle" />
            <span class="toggle__track"></span>
            <span class="text-secondary" style="font-size:13px;">Low stock only</span>
          </label>
        </div>

        <div class="table-wrap" id="inventory-table-wrap">
          <div class="table-loading">Loading inventory…</div>
        </div>

        <div class="table-pagination" id="inventory-pagination"></div>
      </main>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="js/inventory.js"></script>
</body>
</html>
